<section id="card-section" class="  portfolio-preview min-h-full spacing-4" style="min-height: 100%!important">
    <header class="mx-auto grid w-full max-w-6xl px-4 md:px-8" data-aos="fade-up">
        <div class="heading-pre">Let's Connect</div>
        <h1 class="heading-2xl -ml-1">Get in Touch</h1>
    </header>

    <div class="random">
        <div class="card" data-aos="fade-up">
            
            <div class="card__cap">
                <h1 class="card__title text-gray-500">
                    Contact card
                </h1>
                
            </div>
            <div class="card__body gap-4" style="z-index: 100; position:relative; ">

                <div class="card__photo">
                    
                    <app-face #face [shouldSmile]="shouldSmile"></app-face>


                </div>
                <div style="flex: 4">
                    <div class="card__info">
                        

                        <app-card-title (faceSmile)="changeFaceSmile($event)"></app-card-title>

                    </div>
                </div>
                
            </div>


        </div>
    </div>

</section>
