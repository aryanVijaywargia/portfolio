<form class="card__wr1" autocomplete="off" [formGroup]="reactiveForm" (ngSubmit)="onSubmit($event)">
    <div style=" display:flex; flex-direction: row; padding-top:1rem">

        <div class="inputBox">
            <input type="text" required="required" formControlName="name" (focus)="changeSmile(true); onFocus('name')"
                (blur)="changeSmile(false); onBlur('name')">
            <span
                [ngClass]="{'error': submitted && lastSubmit.name && reactiveForm.controls['name'].invalid, 'active': submitted && focused.name && reactiveForm.controls['name'].invalid}">Name</span>
            <i></i>
        </div>

        <div class="inputBox" style="margin-left: 5px;">
            <input type="text" required="required" formControlName="email" (focus)="changeSmile(true); onFocus('email')"
                (blur)=" changeSmile(false); onBlur('email')">
            <span
                [ngClass]="{'error': submitted && lastSubmit.email && reactiveForm.controls['email'].invalid, 'active': submitted && focused.email && reactiveForm.controls['email'].invalid}">Email</span>
            <i></i>
        </div>
        <!-- [class.active]="submitted && focused.message && contactForm.controls.message.invalid" -->

        <textarea style="height: 100px" formControlName="message" (focus)="changeSmile(true); onFocus('message')"

        <span
