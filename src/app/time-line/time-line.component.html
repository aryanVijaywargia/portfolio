<!-- <div *ngFor="let entry of timelineEntries ; let yearIndex = index;">
    <h1>{{ extractYearAndEvents(entry).year}}</h1> -->

<section class="mx-auto  max-w-6xl px-4 pb-16 md:px-8">
    <div class="-mx-4 flex h-96 overflow-x-auto py-4 px-6 xl:mx-0" (inView)="onInViewChanged($event)"
        #scrollContainerRef>
        <div *ngFor="let entry of timelineEntries ; let yearIndex = index;">
            <div class="relative">
                <header class="absolute left-0 -translate-x-1/2 select-none leading-4 font-semibold text-gray-400"
                    style="top: -1.5rem;">
                    {{ entry.year }}
                </header>
                <div class="mt-6 grid" [style.gridTemplateColumns]="'repeat(' + entry.events.length + ', 120px)'">
                    <div *ngFor="let event of entry.events; let index = index" class="relative"
                        [ngClass]="{ selected: selected === getCombinedValue(entry.year, index) }">
                        <button class="absolute flex -translate-x-1/2 flex-col items-center px-3 hfa:outline-none"
                            (mouseover)="onTimelineItemPointerOver(getCombinedValue(entry.year, index))"
                            (pointerover)="onTimelineItemPointerOver(getCombinedValue(entry.year, index))"
                            (focus)="onTimelineItemFocused(getCombinedValue(entry.year, index))"
                            (click)="setSelected(getCombinedValue(entry.year, index))">
                            <span class="sr-only">{{ entry.year }} -
                                {{ event.heading }}</span>
                            <div class="h-8 w-0.5 bg-gray-500 transition-all selected:h-[80px] selected:bg-sky-500"
                                style="display: flex;
                            flex-direction: column-reverse;
                            align-items: center;">
                                <fa-icon [icon]="faCoffee" class="iconColor"
                                    [style.vertical-align]="selected === getCombinedValue(entry.year, index) ? '-80px' : '-20px'">
                                </fa-icon>

                            </div>
                        </button>
                        <div
                            class="absolute top-0 left-px h-2.5 w-[119px] bg-[image:linear-gradient(90deg,transparent_0px,transparent_9px,var(--line-color)_10px,var(--line-color)_10px)] bg-[length:10px_10px] [--line-color:theme(colors.gray.500)]">
                        </div>
                        <main
                            class="pointer-events-none relative mt-32 w-[17rem] opacity-0 transition-opacity  selected:pointer-events-auto selected:opacity-100 -translate-x-1/2 text-center"
                            [ngClass]="{ '-translate-x-1/2 text-center': yearIndex != 0 || index != 0 }">
                            <h3 class="whitespace-nowrap font-semibold tracking-tight text-gray-800 d:text-gray-100">
                                {{ event.heading }}
                            </h3>
                            <p class="text-[15px] font-medium leading-relaxed tracking-tight text-gray-500">
                                {{ event.description }}
                            </p>
                        </main>
                    </div>
                </div>
            </div>
        </div>

        <div class="relative">
            <header class="absolute left-0 -translate-x-1/2 text-xs font-semibold text-gray-400">Today</header>
            <div class="mt-6">
                <section class="relative">
                    <div class="h-8 w-0.5 bg-gray-500 pb-4"></div>

                </section>
            </div>
        </div>
    </div>
</section>
