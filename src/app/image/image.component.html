<img
      [src]="calcSrc()"
      [width]="calculateWidth()"
      [height]="calculateHeight()"
      [style.objectFit]="objectFitStyle"
      [style.maxWidth]="maxWidth ? maxWidth + 'px' : undefined"
      [style.maxHeight]="maxHeight ? maxHeight + 'px' : undefined"
      [style.aspectRatio]="aspectRatio"
>
