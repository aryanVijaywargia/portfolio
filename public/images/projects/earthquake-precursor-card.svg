<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Earthquake Precursor</title>
  <desc id="desc">Amber and crimson artwork with a seismograph logo, wordmark, ionospheric tagline, and pill badges.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="18" x2="376" y2="182" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3F1505"/>
      <stop offset="0.52" stop-color="#9A3412"/>
      <stop offset="1" stop-color="#6E1414"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F87171"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="white" stroke-opacity="0.06"/>
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="400" height="200" rx="24" fill="url(#bg)"/>
  <rect width="400" height="200" rx="24" fill="url(#grid)"/>
  <circle cx="345" cy="18" r="90" fill="#FBBF24" opacity="0.28" filter="url(#blur)"/>
  <circle cx="34" cy="188" r="112" fill="#EF4444" opacity="0.34" filter="url(#blur)"/>

  <g transform="translate(32 28)">
    <circle cx="32" cy="32" r="28" stroke="url(#logo)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="118 30 22 6" stroke-dashoffset="-32"/>
    <path d="M10 32 L20 32 L24 22 L30 44 L36 14 L42 50 L46 26 L50 32 L54 32" stroke="url(#logo)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="36" cy="14" r="2.4" fill="#FFF7ED"/>
    <circle cx="42" cy="50" r="2.4" fill="#FFF7ED"/>
  </g>

  <text x="108" y="65" fill="#FFF7ED" font-family="Inter, ui-sans-serif, system-ui, Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="-1.1">Precursor</text>
  <text x="36" y="107" fill="#FED7AA" font-family="Inter, ui-sans-serif, system-ui, Arial, sans-serif" font-size="12" font-weight="600">Ionospheric LSTM forecasting · ISRO-NESAC</text>

  <g font-family="Inter, ui-sans-serif, system-ui, Arial, sans-serif" font-size="11" font-weight="600">
    <g transform="translate(36 129)">
      <rect width="62" height="26" rx="13" fill="#1B0703" stroke="#7C2D12"/>
      <circle cx="14" cy="13" r="3.5" fill="#FBBF24"/>
      <text x="24" y="17" fill="#FED7AA">LSTM</text>
    </g>
    <g transform="translate(106 129)">
      <rect width="84" height="26" rx="13" fill="#1B0703" stroke="#7C2D12"/>
      <circle cx="14" cy="13" r="3.5" fill="#F87171"/>
      <text x="24" y="17" fill="#FED7AA">Anomaly</text>
    </g>
    <g transform="translate(198 129)">
      <rect width="84" height="26" rx="13" fill="#1B0703" stroke="#7C2D12"/>
      <circle cx="14" cy="13" r="3.5" fill="#FB923C"/>
      <text x="24" y="17" fill="#FED7AA">SOM Map</text>
    </g>
  </g>

  <g transform="translate(36 174)">
    <rect width="328" height="1" fill="#FCD34D" opacity="0.18"/>
    <path d="M0 -8 L34 -8 L38 -4 L42 -14 L46 -4 L50 -8 L88 -8 L94 -12 L98 -6 L102 -8 L150 -8 L156 -16 L160 -2 L164 -8 L228 -8 L234 -13 L238 -4 L242 -8 L328 -8" stroke="url(#trace)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <circle cx="158" cy="-16" r="2.6" fill="#FCD34D"/>
    <circle cx="308" cy="-8" r="3.5" fill="#FBBF24"/>
  </g>
</svg>
