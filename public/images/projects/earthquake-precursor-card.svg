<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Earthquake Precursor</title>
  <desc id="desc">Orange and red earthquake precursor banner with waveform icon and ionospheric signal label.</desc>
  <defs>
    <linearGradient id="bg" x1="26" y1="14" x2="770" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="0.48" stop-color="#F97316"/>
      <stop offset="1" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="panel" x1="120" y1="60" x2="680" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.18"/>
      <stop offset="1" stop-color="white" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="800" height="400" rx="18" fill="url(#bg)"/>
  <circle cx="154" cy="76" r="120" fill="#FDE68A" fill-opacity="0.3"/>
  <circle cx="650" cy="310" r="100" fill="#EF4444" fill-opacity="0.24"/>

  <path d="M28 28H70" stroke="white" stroke-opacity="0.34" stroke-width="2"/>
  <path d="M28 28V70" stroke="white" stroke-opacity="0.34" stroke-width="2"/>
  <path d="M730 370H770" stroke="white" stroke-opacity="0.34" stroke-width="2"/>
  <path d="M770 330V370" stroke="white" stroke-opacity="0.34" stroke-width="2"/>

  <rect x="120" y="60" width="560" height="280" rx="24" stroke="white" stroke-opacity="0.56" stroke-width="4" fill="url(#panel)" fill-opacity="0.05"/>

  <path d="M-20 196C76 158 138 188 224 214C309 239 384 219 460 188C540 155 620 164 820 226" stroke="white" stroke-opacity="0.2" stroke-width="2"/>
  <path d="M-20 220C80 192 152 224 224 232C305 242 384 208 467 198C550 188 620 209 820 240" stroke="white" stroke-opacity="0.15" stroke-width="2"/>

  <g transform="translate(350 102)">
    <circle cx="50" cy="50" r="44" stroke="white" stroke-opacity="0.42" stroke-width="4"/>
    <circle cx="50" cy="50" r="9" fill="#FBBF24" fill-opacity="0.9"/>
    <path d="M0 16L50 6L95 60" stroke="white" stroke-opacity="0.42" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="0" cy="16" r="5" fill="white"/>
    <circle cx="50" cy="6" r="4" fill="white" fill-opacity="0.75"/>
    <circle cx="95" cy="60" r="5" fill="white"/>
    <path d="M-10 42L6 31L21 57L29 36" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="70" cy="70" r="4" fill="white" fill-opacity="0.88"/>
  </g>

  <text x="400" y="260" fill="white" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" letter-spacing="1.5">EARTHQUAKE PRECURSOR</text>
  <text x="400" y="292" fill="white" fill-opacity="0.82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4">ISRO-NESAC · IONOSPHERIC SIGNALS</text>
  <text x="400" y="316" fill="white" fill-opacity="0.64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1">LSTM FORECASTING · ANOMALY DETECTION · SOM PREDICTION</text>
