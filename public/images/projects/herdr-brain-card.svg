<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Herdr Brain</title>
  <desc id="desc">Ink and lavender artwork with a terminal pane logo, wordmark, and two agent panes, claude and codex, whose fragments meet in one memory node that feeds a new session.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="18" x2="376" y2="182" gradientUnits="userSpaceOnUse">
      <stop stop-color="#131316"/>
      <stop offset="0.55" stop-color="#1A1A1E"/>
      <stop offset="1" stop-color="#261F33"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4D2FB"/>
      <stop offset="1" stop-color="#A57FE0"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="400" height="200" rx="24" fill="url(#bg)"/>
  <g fill="#3A3A42">
    <circle cx="58" cy="16" r="1"/><circle cx="174" cy="22" r="0.8"/><circle cx="236" cy="12" r="1"/>
    <circle cx="214" cy="84" r="0.8"/><circle cx="246" cy="58" r="1"/><circle cx="18" cy="118" r="0.8"/>
    <circle cx="282" cy="186" r="1"/><circle cx="388" cy="104" r="0.8"/><circle cx="148" cy="188" r="0.8"/>
  </g>
  <circle cx="330" cy="96" r="80" fill="#CBA6F7" opacity="0.2" filter="url(#blur)"/>
  <circle cx="34" cy="188" r="104" fill="#7C5CC4" opacity="0.24" filter="url(#blur)"/>

  <g transform="translate(32 28)">
    <path d="M13 5H5V59H59V5H31" stroke="url(#logo)" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="22" cy="5" r="5" fill="#CBA6F7"/>
    <path d="M17 29L25 36L17 43" stroke="#EAE8EE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="31" y="28" width="10" height="16" rx="1" fill="#CBA6F7"/>
  </g>

  <text x="108" y="65" fill="#EAE8EE" font-family="Inter, ui-sans-serif, system-ui, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-1">Herdr <tspan fill="#CBA6F7">Brain</tspan></text>
  <text x="36" y="107" fill="#CDCCD2" font-family="Inter, ui-sans-serif, system-ui, Arial, sans-serif" font-size="12" font-weight="600">One memory for every agent in herdr</text>

  <g font-family="Inter, ui-sans-serif, system-ui, Arial, sans-serif" font-size="11" font-weight="600">
    <g transform="translate(36 129)">
      <rect width="70" height="26" rx="13" fill="#121215" stroke="#3A3A42"/>
      <circle cx="14" cy="13" r="3.5" fill="#E6B84A"/>
      <text x="24" y="17" fill="#EAE8EE">Capture</text>
    </g>
    <g transform="translate(114 129)">
      <rect width="66" height="26" rx="13" fill="#121215" stroke="#3A3A42"/>
      <circle cx="14" cy="13" r="3.5" fill="#CBA6F7"/>
      <text x="24" y="17" fill="#EAE8EE">Review</text>
    </g>
    <g transform="translate(188 129)">
      <rect width="62" height="26" rx="13" fill="#121215" stroke="#3A3A42"/>
      <circle cx="14" cy="13" r="3.5" fill="#52C97A"/>
      <text x="24" y="17" fill="#EAE8EE">Recall</text>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="600">
    <path d="M274 30H268V66H318V30H314" stroke="#55555E"/>
    <text x="277" y="33" fill="#B0AFB6">claude</text>
    <rect x="274" y="40" width="28" height="3" rx="1.5" fill="#4A4A52"/>
    <rect x="274" y="48" width="36" height="4" rx="2" fill="#CBA6F7"/>
    <rect x="274" y="57" width="20" height="3" rx="1.5" fill="#4A4A52"/>

    <path d="M332 30H326V66H376V30H366" stroke="#55555E"/>
    <text x="335" y="33" fill="#B0AFB6">codex</text>
    <rect x="332" y="40" width="24" height="3" rx="1.5" fill="#4A4A52"/>
    <rect x="332" y="48" width="36" height="4" rx="2" fill="#CBA6F7"/>
    <rect x="332" y="57" width="30" height="3" rx="1.5" fill="#4A4A52"/>

    <g stroke="#CBA6F7" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
      <path d="M293 66C293 82 308 90 314 94"/>
      <path d="M351 66C351 82 336 90 330 94"/>
      <path d="M333 100C350 100 356 110 356 128"/>
    </g>
    <circle cx="322" cy="100" r="10" fill="#CBA6F7" opacity="0.5" filter="url(#glow)"/>
    <circle cx="322" cy="100" r="11" fill="#17171A" stroke="#CBA6F7" stroke-width="2"/>
    <circle cx="322" cy="100" r="4.5" fill="#F1E6FF"/>

    <path d="M274 128H268V170H376V128H342" stroke="#CBA6F7" stroke-opacity="0.7"/>
    <text x="277" y="131" fill="#CBA6F7">new session</text>
    <rect x="274" y="140" width="56" height="14" rx="1" fill="#CBA6F7"/>
    <text x="278" y="150" fill="#17171A" font-weight="700">use pnpm</text>
    <rect x="274" y="160" width="40" height="3" rx="1.5" fill="#4A4A52"/>
  </g>

  <g transform="translate(36 178)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="600">
    <text x="0" y="0" fill="#908F96"><tspan fill="#CBA6F7">❯</tspan> brain recall</text>
    <rect x="90" y="-9" width="6" height="11" fill="#CBA6F7" opacity="0.8"/>
  </g>
</svg>
