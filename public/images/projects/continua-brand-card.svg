<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Continua</title>
  <desc id="desc">Blue Continua brand artwork with logo, wordmark, and subtle trace accents.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="18" x2="376" y2="182" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.54" stop-color="#0A2450"/>
      <stop offset="1" stop-color="#102A72"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="white" stroke-opacity="0.06"/>
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="400" height="200" rx="24" fill="url(#bg)"/>
  <rect width="400" height="200" rx="24" fill="url(#grid)"/>
  <circle cx="345" cy="18" r="90" fill="#2DD4BF" opacity="0.16" filter="url(#blur)"/>
  <circle cx="34" cy="188" r="112" fill="#6366F1" opacity="0.22" filter="url(#blur)"/>
  <g transform="translate(32 28)">
    <circle cx="32" cy="32" r="28" stroke="url(#logo)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="118 30 22 6" stroke-dashoffset="-32"/>
    <path d="M46 18A18 18 0 1 0 46 46" stroke="url(#logo)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="46" cy="18" r="3.25" fill="url(#logo)"/>
    <circle cx="46" cy="46" r="3.25" fill="url(#logo)"/>
  </g>
  <text x="108" y="69" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, Arial, sans-serif" font-size="37" font-weight="800" letter-spacing="-1.4">Continua</text>
  <text x="36" y="107" fill="#BFDBFE" font-family="Inter, ui-sans-serif, system-ui, Arial, sans-serif" font-size="14" font-weight="600">Durable execution for AI agents</text>
  <g font-family="Inter, ui-sans-serif, system-ui, Arial, sans-serif" font-size="11" font-weight="600">
    <g transform="translate(36 129)">
      <rect width="78" height="26" rx="13" fill="#091222" stroke="#1E3A5F"/>
      <circle cx="16" cy="13" r="3.5" fill="#2DD4BF"/>
      <text x="27" y="17" fill="#DBEAFE">Replay</text>
    </g>
    <g transform="translate(122 129)">
      <rect width="86" height="26" rx="13" fill="#091222" stroke="#1E3A5F"/>
      <circle cx="16" cy="13" r="3.5" fill="#A78BFA"/>
      <text x="27" y="17" fill="#DBEAFE">Recover</text>
    </g>
    <g transform="translate(216 129)">
      <rect width="82" height="26" rx="13" fill="#091222" stroke="#1E3A5F"/>
      <circle cx="16" cy="13" r="3.5" fill="#FBBF24"/>
      <text x="27" y="17" fill="#DBEAFE">Inspect</text>
    </g>
  </g>
  <g transform="translate(36 174)">
    <rect width="328" height="1" fill="#93C5FD" opacity="0.14"/>
    <rect x="0" y="-12" width="122" height="8" rx="4" fill="#334155"/>
    <rect x="138" y="-12" width="88" height="8" rx="4" fill="url(#trace)"/>
    <rect x="238" y="-12" width="54" height="8" rx="4" fill="#A78BFA"/>
    <circle cx="308" cy="-8" r="4" fill="#FBBF24"/>
  </g>
