<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
</head>

<header [ngClass]="{'fixed': isFixed, 'd':!receivedTheme}" [ngStyle]="{'opacity': opacity}" #header
    class="fixed inset-x-0 top-0 z-50 h-20 w-full border-b backdrop-blur d:border-gray-100/10 dark:bg-gray-900/40 print:hidden bg-white/50">
    <div class="header-content">
        <div class="left-content">
            <div class="wrapper">
                <div class="button2">
                    <div class="icon ">
                        <i class="fab fa-facebook-f"></i>
                    </div>
                    <span>Facebook</span>
                </div>
                <div class="button2">
                    <div class="icon ">
                        <i class="fab fa-twitter"></i>
                    </div>
                    <span>Twitter</span>
                </div>

            </div>
        </div>
        <div class="middle-content scroll-smooth">
            <div class="wrapper">
                <div class="button1" (click)="onClickScroll('hero-section')" #buttonView>
                    <div class="icon" [class.hovered]="true">
                        <i class="fas fa-home"></i>
                    </div>
                    <span>Home</span>
                </div>
                <div class="button1" (click)="onClickScroll('about-section')" #buttonView>
                    <div class="icon">
                        <i class="fas fa-solid fa-user"></i>
                    </div>
                    <span>About Me</span>
                </div>
                <div class="button1" (click)="onClickScroll('experience-section')" #buttonView>
                    <div class="icon ">
                        <i class="fas fa-solid fa-briefcase"></i>
                    </div>
                    <span>Experience</span>
                </div>
                <div class="button1" (click)="onClickScroll('project-section')" #buttonView>
                    <div class="icon ">
                        <i class="fas fa-solid fa-diagram-project"></i>
                    </div>
                    <span>Project</span>
                </div>
                <div class="button1" (click)="onClickScroll('card-section')" #buttonView>
                    <div class="icon ">
                        <i class="fas fa-regular fa-envelope"></i>
                    </div>
                    <span>Contact Me</span>
                </div>
            </div>
        </div>
        <div class="right-content" #parentDiv>

            <div (click)=" toggleChat()" [ngClass]="{'d':!receivedTheme}"
                class="icon-robot rounded transition-colors bg-gray-500/80 ">
                <i [ngClass]="{'d':!receivedTheme}" style="font-size: 19px;" class="fas fa-robot "></i>
            </div>

            <a href="https://github.com/AryanVijaywargia" style="margin-right: 5%;"
                class="rounded p-2 text-gray-500 transition-colors hfa:d:text-gray-100/80  d:hfa:text-white">
                <span class="sr-only">Github</span>
                <fa-icon [icon]="faGithub" style="font-size: 30px;"></fa-icon>
            </a>

            <a style="padding: 0.375rem 1rem;"
                class="cursor-pointer resume-button button-rainbow button-border inline-flex whitespace-nowrap bg-white/90 px-10 py-2.5 text-sm font-medium tracking-tight text-gray-500 transition-all hfa:border-gray-900/70 hfa:bg-white/90 hfa:text-gray-900 d:border-gray-700/80 d:bg-transparent d:text-gray-300 d:hfa:border-gray-200/30 d:hfa:bg-gray-900/80 d:hfa:text-gray-50 md:px-12">
                Resume
            </a>

            <div (click)="toggleNav()" class="hamburger-show ">
                <app-hamburger-icon></app-hamburger-icon>
                <app-burger-menu (childRendered)="onZIndexRendered()" [showNav]="navFlag"></app-burger-menu>
            </div>
        </div>
    </div>
    <div class="background pointer-events-none absolute inset-0 z-0 select-none"></div>
</header>
<div class="pointer-events-none h-20 select-none transition print:hidden"></div>
