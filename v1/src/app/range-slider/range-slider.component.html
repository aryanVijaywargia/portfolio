<form action="/p/quote.php" method="GET">

    <div [ngClass]="{'d':receivedTheme}" id="debt-amount-slider">
        <input [ngClass]="{'d':receivedTheme}" type="radio" name="debt-amount" id="1" value="Small" required
            [(ngModel)]="selectedValue" (change)="onInputChange(selectedValue)">
        <label [ngClass]="{'d':receivedTheme}" for="1" data-debt-amount="Small"></label>

        <input [ngClass]="{'d':receivedTheme}" type="radio" name="debt-amount" id="3" value="Medium" required
            [(ngModel)]="selectedValue" (change)="onInputChange(selectedValue)">
        <label [ngClass]="{'d':receivedTheme}" for="3" data-debt-amount="Medium"></label>

        <input [ngClass]="{'d':receivedTheme}" type="radio" name="debt-amount" id="5" value="Large" required
            [(ngModel)]="selectedValue" (change)="onInputChange(selectedValue)">
        <label [ngClass]="{'d':receivedTheme}" for="5" data-debt-amount="Large"></label>

        <div [ngClass]="{'d':receivedTheme}" id="debt-amount-pos"></div>
    </div>

</form>
